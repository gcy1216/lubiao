<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 路标装置 · Signpost</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;          /* 纯白背景 */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1a1a1a;
  }

  /* ---------- WebGL 画布 ---------- */
  #scene-container {
    position: fixed;
    inset: 0;
    background: #ffffff;
  }
  #scene-container canvas { display: block; }

  /* ---------- 底部操作提示 ---------- */
  #hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(248, 248, 249, 0.78);
    border: 1px solid rgba(0, 0, 0, 0.055);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: #6d6d72;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  /* ---------- 左上角标题 ---------- */
  #brand {
    position: fixed;
    left: 30px;
    top: 26px;
    user-select: none;
    pointer-events: none;
  }
  #brand h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #1d1d1f;
  }
  #brand p {
    margin-top: 5px;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: #a1a1a6;
  }

  /* ---------- 加载遮罩 ---------- */
  #loader {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 30;
    transition: opacity 0.6s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 26px;
    height: 26px;
    border: 2px solid #e8e8ea;
    border-top-color: #1d1d1f;
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  #loader span { font-size: 12px; letter-spacing: 0.1em; color: #9b9b9f; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 右键换图面板 ---------- */
  #img-picker {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 25;
    display: none;
    width: 264px;
    padding: 12px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 18px 50px rgba(26, 54, 82, 0.20);
    user-select: none;
  }
  #img-picker.show { display: block; animation: pop 0.18s cubic-bezier(0.2, 0.8, 0.3, 1); }
  #img-picker h2 {
    margin-bottom: 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #8a8a90;
  }
  #img-picker h2 em { font-style: normal; color: #1d1d1f; }
  #img-picker .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    max-height: 232px;
    overflow-y: auto;
  }
  #img-picker .thumb {
    aspect-ratio: 1;
    border-radius: 9px;
    overflow: hidden;
    cursor: pointer;
    background: #eceef1;
    border: 2px solid transparent;
    transition: transform 0.16s ease, border-color 0.16s ease;
  }
  #img-picker .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #img-picker .thumb:hover { transform: translateY(-2px) scale(1.05); }
  #img-picker .thumb.active { border-color: #1d1d1f; }
  #img-picker .upload {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: 1px dashed rgba(0, 0, 0, 0.18);
    border-radius: 10px;
    background: transparent;
    font: inherit;
    font-size: 12px;
    color: #4a4a4f;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  #img-picker .upload:hover { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.32); }
  #img-picker .upload.ghost {
    margin-top: 6px;
    padding: 6px;
    border-style: solid;
    border-color: transparent;
    font-size: 11px;
    color: #8a8a90;
  }
  #img-picker .note {
    margin-top: 8px;
    font-size: 10px;
    line-height: 1.5;
    text-align: center;
    color: #a9a9b0;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.94) translateY(-5px); }
    to   { opacity: 1; transform: none; }
  }
  /* ---------- file:// 协议提示（本地直接双击打开时贴图会被浏览器拦截） ---------- */
  #file-tip {
    position: fixed;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);
    display: none;
    max-width: min(760px, calc(100vw - 60px));
    padding: 14px 18px;
    border-radius: 14px;
    background: #fff8e6;
    border: 1px solid #f0dca8;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    font-size: 12.5px;
    line-height: 1.75;
    color: #6b5a20;
    z-index: 20;
  }
  #file-tip.show { display: block; }
  #file-tip b { color: #4a3d10; }
  #file-tip code {
    display: inline-block;
    margin-top: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.055);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: #3d3410;
    user-select: all;
  }
</style>
</head>
<body>
  <div id="scene-container"></div>

  <div id="brand">
    <h1>路标装置 / SIGNPOST</h1>
    <p>THREE.JS INTERACTIVE STUDY</p>
  </div>

  <div id="hint">拖动 · 水平环绕观察　　点击路牌 · 聚焦查看　　右键路牌 · 更换图片</div>

  <!-- 右键路牌时弹出的图片选择面板（内容由 JS 生成） -->
  <div id="img-picker"></div>

  <div id="file-tip"></div>

  <div id="loader">
    <div class="ring"></div>
    <span>LOADING</span>
  </div>
  <!-- file:// 兜底提示。
       下面的主脚本是 ES module，用 file:// 直接双击打开时会被 Chrome 的 CORS 策略
       整体拦掉 —— 一行代码都不会执行，页面会永远停在 LOADING。
       所以这里用一段"普通脚本"（不是 module，file:// 下也能跑）先判断协议。 -->
  <script>
  if (location.protocol === 'file:') {
    var tip = document.getElementById('file-tip');
    tip.innerHTML =
      '<b>需要用本地服务器打开。</b>' +
      '这个页面用的是 ES module，Chrome 在 <code>file://</code> 下会直接拦截，所以双击打开是空白的。<br>' +
      '在「终端」里执行下面两行，然后访问 <code>http://localhost:8000</code>：<br>' +
      '<code>cd ~/Desktop/电线杆</code><br>' +
      '<code>python3 -m http.server 8000</code>';
    tip.classList.add('show');
    document.getElementById('loader').classList.add('hidden');
  }
  </script>

  <!-- Three.js：使用同目录 lib/ 下的本地文件，离线也能跑。
       如果 lib/ 文件夹丢了，把下面的路径换成 CDN 即可：
       "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
       （同时把下面 import OrbitControls 的路径换成
        https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js） -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js"
    }
  }
  </script>

  <script type="module">
  /* ══════════════════════════════════════════════════════════════
   * 3D 路标装置 · 单文件实现
   *
   * 结构总览：
   *   1. CONFIG          —— 所有可调参数（颜色 / 尺寸 / 动画 / 布局）
   *   2. 渲染环境         —— renderer / scene / camera / 灯光 / 影棚环境贴图
   *   3. 贴图系统         —— 多目录回退加载 + 自动占位图 + cover 裁切 UV
   *   4. 建模             —— 路杆、箍环、支撑结构、五种形状的路牌
   *   5. 交互             —— 锁定俯仰的环绕 + 点击聚焦 / 退出 + 右键换图面板
   *   6. 动画             —— 球坐标缓动，相机与模型同步位移
   * ════════════════════════════════════════════════════════════ */

  import * as THREE from 'three';
  import { OrbitControls } from './lib/OrbitControls.js';

  /* ============================================================
   * 1. 全局配置
   * ========================================================== */
  const CONFIG = {
    /* ---- 贴图 ----
     * 浏览器出于安全限制无法列举磁盘目录，所以图片文件名写在这里。
     * 加载时会按 IMAGE_DIRS 的顺序逐个目录尝试，谁先成功就用谁；
     * 全部失败时自动生成 data URL 占位图，页面依然可以正常浏览。
     * 新增图片：把文件丢进 tupian/ 文件夹，再把文件名加进 IMAGE_FILES 即可。
     * 目录名用纯英文，静态托管平台不会因为中文路径 404。 */
    IMAGE_DIRS: ['tupian', 'images', '图片'],
    IMAGE_FILES: [
      '2171023B9CD90C703301F23A1606E082.jpg',
      '368F7CE72AE78CEF73FE41E939B76DA6.jpg',
      '3D741B80C3EA393553B841DB892A72C8.jpg',
      '86FDCD019539A0652AAB0969035A1A01.jpg',
      '8747FC2C7A140B69FCE182B0CCC265F1.jpg',
      '9518238CB3A34CE929A2B0FBF7833644.jpg',
      'BAC2F62067BD09108F80CB6140929D27.jpg',
      'F2D13A89EEFE3C3D32BA2F2F2E574570.jpg',
      'FDE59D1DDCA692F79D58FAD7E2F92533.jpg',
    ],
    /* 改动 tupian/ 里的默认图之后，把这个数字 +1：
     * 浏览器里保存的旧图片状态会失效，下次打开直接用新的默认图。 */
    DEFAULTS_VERSION: 2,
    PLACEHOLDER_COUNT: 8,     // 一张图都读不到时，生成几张占位图
    SHUFFLE_SEED: 20260818,   // 固定随机种子：图片分配随机但每次刷新一致
    /* ---- 颜色 ---- */
    COLOR_BG:    0xffffff,    // 背景：纯白
    COLOR_POLE:  0x121316,    // 中央路杆：黑（带金属反射）
    COLOR_RING:  0x4b4e54,    // 箍环：深灰金属
    COLOR_ARM:   0x1a1c1f,    // 支撑横杆：近黑
    COLOR_PLATE: 0xd6d8dd,    // 路牌背板：浅灰金属
    COLOR_FRAME: 0xe6e8ec,    // 路牌边框：浅灰金属（比背板略亮）

    /* ---- 尺寸 ---- */
    POLE_HEIGHT: 19,          // 路杆总高
    POLE_RADIUS: 0.24,        // 路杆底部半径（顶部会略收细）
    POLE_TAPER:  0.86,        // 顶部半径 = 底部半径 × 该系数
    SIGN_THICK:  0.14,        // 路牌板材厚度（有厚度，但不厚）
    SIGN_BORDER: 0.16,        // 路牌金属边框宽度

    /* ---- 箍环（系数越接近 1、高度越小 = 越细） ---- */
    RING_GROW:    1.14,       // 装饰箍环半径 = 该高度的路杆半径 × 此系数
    RING_HEIGHT:  0.15,       // 装饰箍环高度
    CLAMP_GROW:   1.20,       // 路牌抱箍：要受力，比装饰环略粗一点
    CLAMP_HEIGHT: 0.26,       // 路牌抱箍高度
    BOLT_RADIUS:  0.030,      // 箍环侧面紧固螺栓半径

    /* ---- 相机 ---- */
    FOV: 38,
    HOME_AZIMUTH: 34,         // 默认水平方位角（度）
    POLAR_CENTER: 86,         // 默认俯仰角（度，90 = 完全水平）
    POLAR_RANGE: 5,           // 俯仰允许浮动范围（度）—— 基本锁死上下旋转
    FRAME_MARGIN: 1.10,       // 整体取景留白系数（越大越远）
    FOCUS_MARGIN: 1.18,       // 聚焦时路牌四周留白系数（越小路牌越大）
    ZOOM_MIN_FACTOR: 0.45,    // 最近可推到默认距离的百分比
    ZOOM_MAX_FACTOR: 1.60,    // 最远可拉到默认距离的百分比

    /* ---- 动画 ---- */
    FOCUS_DURATION: 1.15,     // 进入聚焦时长（秒）
    RESET_DURATION: 1.0,      // 退出聚焦时长（秒）
    DIM_OPACITY: 0.14,        // 聚焦时其余路牌淡出到多少不透明度
    HOVER_SCALE: 0.035,       // 悬停时路牌放大比例
    AUTO_ROTATE: true,        // 空闲时缓慢自转
    AUTO_ROTATE_SPEED: 0.32,
    AUTO_ROTATE_IDLE: 3.0,    // 停手多少秒后开始自转
  };

  /* ---- 路牌布局：手工编排，刻意不均匀，保证疏密节奏 ----
   * shape : hrect(横向矩形) / vrect(竖向矩形) / square / circle / tri
   * y     : 安装高度
   * angle : 支撑杆绕路杆的方位角（度）
   * yaw   : 路牌相对支撑杆的额外偏转（度，保持负值）
   *         —— 让"路牌正面法线"和"支撑杆方向"错开一点，
   *            于是相机转到正面时，路杆会自然落在画面左侧，
   *            正好对应"整组向左移动、路牌居中"的构图。
   * tilt  : 轻微左右倾斜（度），避免死板
   * arm   : 支撑杆长度（从杆轴心到路牌背面的距离）
   */
  const SIGN_LAYOUT = [
    { shape: 'hrect',  y: 17.0, angle:  14, yaw: -30, tilt:  1.6, arm: 2.5, w: 4.4, h: 2.0 },
    { shape: 'tri',    y: 15.6, angle: 262, yaw: -26, tilt: -2.0, arm: 2.1, s: 2.5 },
    { shape: 'vrect',  y: 14.3, angle: 152, yaw: -34, tilt:  1.0, arm: 2.0, w: 2.1, h: 3.5 },
    { shape: 'circle', y: 12.2, angle:  52, yaw: -28, tilt:  0.0, arm: 2.4, r: 1.40 },
    { shape: 'square', y: 11.0, angle: 214, yaw: -32, tilt: -1.4, arm: 2.2, s: 2.7 },
    { shape: 'hrect',  y:  9.0, angle: 100, yaw: -24, tilt:  2.2, arm: 2.7, w: 3.9, h: 1.8 },
    { shape: 'circle', y:  7.9, angle: 320, yaw: -36, tilt:  0.0, arm: 2.0, r: 1.15 },
    { shape: 'vrect',  y:  6.7, angle: 186, yaw: -27, tilt: -1.8, arm: 1.9, w: 1.95, h: 3.2 },
    { shape: 'tri',    y:  4.7, angle:  36, yaw: -31, tilt:  1.2, arm: 2.6, s: 2.9 },
    { shape: 'square', y:  3.3, angle: 130, yaw: -25, tilt: -1.0, arm: 2.0, s: 2.2 },
  ];

  // 额外的装饰性箍环高度（不挂路牌，只做结构细节）
  const EXTRA_RING_HEIGHTS = [1.8, 5.8, 10.1, 13.2, 16.4, 18.3];

  /* ============================================================
   * 2. 渲染环境
   * ========================================================== */
  const container = document.getElementById('scene-container');
  const hintEl    = document.getElementById('hint');
  const loaderEl  = document.getElementById('loader');
  const fileTipEl = document.getElementById('file-tip');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  // 关键：不做色调映射，才能保证 0xffffff 输出仍然是"纯白"
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(CONFIG.COLOR_BG, 1);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(CONFIG.COLOR_BG);

  const camera = new THREE.PerspectiveCamera(
    CONFIG.FOV, window.innerWidth / window.innerHeight, 0.1, 500
  );

  // 整个装置的观察中心 & 聚焦时路牌要落到的世界坐标锚点
  // （具体数值在 fitCameraToInstallation() 里根据模型包围盒自动算出）
  const HOME_TARGET  = new THREE.Vector3(0, 9.5, 0);
  const FOCUS_ANCHOR = new THREE.Vector3(0, 9.5, 0);

  camera.position.set(0, 12, 30);
  /* ---- 灯光 ----
   * 只用灯 + 环境贴图，不投射阴影（场景里没有任何地面/接影平面）。 */
  // 光照总量刻意压到"白色不过曝"的水平：NoToneMapping 下超过 1 的亮度会被直接截断，
  // 图片里的饱和色（尤其蓝色通道）一旦顶到 255 就会发灰发白，所以整套灯光都按半档给。
  scene.add(new THREE.HemisphereLight(0xffffff, 0xe9e9ee, 0.6));

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);   // 主光：右上前
  keyLight.position.set(7, 14, 11);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.575); // 补光：左后
  fillLight.position.set(-11, 6, -8);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);   // 轮廓光：正前偏左
  rimLight.position.set(-5, 3, 13);
  scene.add(rimLight);

  /* ---- 影棚环境贴图 ----
   * 金属材质（metalness 高）没有环境反射会发黑，
   * 所以用 PMREMGenerator 把一个"程序化影棚"烘成环境贴图。
   * 全程不依赖任何外部 HDR 文件。 */
  function buildStudioEnvironment() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0xf4f4f6);

    // 反过来的大盒子 = 影棚四壁
    const room = new THREE.Mesh(
      new THREE.BoxGeometry(40, 40, 40),
      new THREE.MeshBasicMaterial({ color: 0xf7f7f9, side: THREE.BackSide })
    );
    envScene.add(room);

    // 柔光板：亮度可以大于 1（PMREM 用半浮点缓冲，支持 HDR）
    const addSoftbox = (w, h, pos, rot, intensity, color = 0xffffff) => {
      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(color).multiplyScalar(intensity),
      });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.position.copy(pos);
      m.rotation.copy(rot);
      envScene.add(m);
    };
    addSoftbox(16, 16, new THREE.Vector3(0, 15, 0),   new THREE.Euler(Math.PI / 2, 0, 0),  3.4);  // 顶光
    addSoftbox(14, 22, new THREE.Vector3(-14, 2, 5),  new THREE.Euler(0, Math.PI / 2, 0),  2.0);  // 左侧柔光
    addSoftbox(14, 22, new THREE.Vector3(14, 0, -5),  new THREE.Euler(0, -Math.PI / 2, 0), 1.3);  // 右侧压光
    addSoftbox(20, 12, new THREE.Vector3(0, -12, 0),  new THREE.Euler(-Math.PI / 2, 0, 0), 0.9);  // 底部反光

    const rt = pmrem.fromScene(envScene, 0.02);
    pmrem.dispose();
    return rt.texture;
  }
  scene.environment = buildStudioEnvironment();
  /* ---- OrbitControls：只允许水平环绕 ---- */
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enablePan = false;                       // 禁止平移，构图始终可控
  controls.rotateSpeed = 0.75;
  // 上下角度基本锁死：只留 ±POLAR_RANGE 度的余量
  controls.minPolarAngle = THREE.MathUtils.degToRad(CONFIG.POLAR_CENTER - CONFIG.POLAR_RANGE);
  controls.maxPolarAngle = THREE.MathUtils.degToRad(CONFIG.POLAR_CENTER + CONFIG.POLAR_RANGE);
  controls.autoRotateSpeed = CONFIG.AUTO_ROTATE_SPEED;
  controls.update();

  /* ============================================================
   * 3. 贴图系统
   * ========================================================== */
  const textureLoader = new THREE.TextureLoader();
  const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

  function setupTexture(tex) {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = maxAnisotropy;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    return tex;
  }

  // 目录名和文件名都可能是中文/带空格 —— 逐段编码，避免 URL 解析失败
  function buildUrl(dir, file) {
    const dirPart = dir.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    return (dirPart ? dirPart + '/' : '') + encodeURIComponent(file);
  }

  // 依次尝试 IMAGE_DIRS 里的每个目录，返回第一个加载成功的贴图；全失败返回 null
  function loadTextureWithFallback(file, dirIndex = 0) {
    return new Promise(resolve => {
      if (dirIndex >= CONFIG.IMAGE_DIRS.length) { resolve(null); return; }
      textureLoader.load(
        buildUrl(CONFIG.IMAGE_DIRS[dirIndex], file),
        tex => resolve(setupTexture(tex)),
        undefined,
        () => resolve(loadTextureWithFallback(file, dirIndex + 1))
      );
    });
  }
  /* 占位图：图片不存在时用 canvas 现场画一张（本质就是 data URL 图片），
   * 带编号和网格，方便一眼确认 UV 是否正确。 */
  function createPlaceholderTexture(index, total) {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');

    const hue = (index / Math.max(total, 1)) * 320;
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, `hsl(${hue}, 58%, 64%)`);
    grad.addColorStop(1, `hsl(${(hue + 46) % 360}, 64%, 42%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      const p = (size / 8) * i;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 168px -apple-system, sans-serif';
    ctx.fillText(String(index + 1), size / 2, size / 2 - 22);
    ctx.font = '600 30px -apple-system, sans-serif';
    ctx.fillText('PLACEHOLDER', size / 2, size / 2 + 96);

    return setupTexture(new THREE.CanvasTexture(canvas));
  }

  /* 读取全部图片：成功几张用几张，全失败则生成占位图。
   * 返回 { name, texture } 数组 —— name 会显示在右键换图面板里。 */
  async function loadAllTextures() {
    const results = await Promise.all(
      CONFIG.IMAGE_FILES.map(async f => {
        const texture = await loadTextureWithFallback(f);
        return texture ? { name: f, texture } : null;
      })
    );
    const loaded = results.filter(Boolean);

    if (loaded.length > 0) return { entries: loaded, usedPlaceholder: false };

    const n = CONFIG.PLACEHOLDER_COUNT;
    return {
      entries: Array.from({ length: n }, (_, i) => ({
        name: `占位图 ${i + 1}`,
        texture: createPlaceholderTexture(i, n),
      })),
      usedPlaceholder: true,
    };
  }
  function getTextureAspect(tex) {
    const img = tex.image;
    if (!img) return 1;
    const w = img.naturalWidth || img.width || 1;
    const h = img.naturalHeight || img.height || 1;
    return w / h;
  }

  /* 【重点 1】按包围盒重算 UV。
   * ShapeGeometry 生成的 UV 直接等于顶点坐标（比如 -1.2 ~ 1.2），
   * 不做处理就会出现贴图错位、拉伸甚至整块发黑。
   * 这里统一把 UV 归一化到 0~1，任何平面形状都能正确贴图。 */
  function remapUVByBoundingBox(geometry) {
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const w = (bb.max.x - bb.min.x) || 1;
    const h = (bb.max.y - bb.min.y) || 1;
    const pos = geometry.attributes.position;
    const uv = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) {
      uv[i * 2]     = (pos.getX(i) - bb.min.x) / w;
      uv[i * 2 + 1] = (pos.getY(i) - bb.min.y) / h;
    }
    geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geometry.attributes.uv.needsUpdate = true;
    return { aspect: w / h };
  }

  /* 【重点 2】等比裁切（等价于 CSS 的 background-size: cover）。
   * 只改 texture 的 repeat / offset，图片永远不会被拉扁或拉长。
   * 每块路牌用自己的 texture.clone()，互不干扰。 */
  function fitTextureCover(tex, targetAspect) {
    const texAspect = getTextureAspect(tex);
    if (texAspect > targetAspect) {
      tex.repeat.set(targetAspect / texAspect, 1);   // 图更宽 → 裁左右
    } else {
      tex.repeat.set(1, texAspect / targetAspect);   // 图更高 → 裁上下
    }
    tex.offset.set((1 - tex.repeat.x) / 2, (1 - tex.repeat.y) / 2);
    tex.needsUpdate = true;
  }

  /* 固定种子的伪随机 —— 贴图分配"看起来随机"，但每次刷新结果一致 */
  function createRandom(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  /* ============================================================
   * 4. 建模
   * ========================================================== */

  /** 圆角多边形轮廓（三角形路牌的圆润边角就靠它） */
  function roundedPolygonShape(points, radius) {
    const shape = new THREE.Shape();
    const n = points.length;
    for (let i = 0; i < n; i++) {
      const prev = points[(i - 1 + n) % n];
      const cur  = points[i];
      const next = points[(i + 1) % n];
      const toPrev = new THREE.Vector2().subVectors(prev, cur);
      const toNext = new THREE.Vector2().subVectors(next, cur);
      // 圆角半径不能超过相邻边长的一半
      const r = Math.min(radius, toPrev.length() * 0.48, toNext.length() * 0.48);
      const p1 = cur.clone().add(toPrev.normalize().multiplyScalar(r));
      const p2 = cur.clone().add(toNext.normalize().multiplyScalar(r));
      if (i === 0) shape.moveTo(p1.x, p1.y);
      else         shape.lineTo(p1.x, p1.y);
      shape.quadraticCurveTo(cur.x, cur.y, p2.x, p2.y);   // 用二次曲线走圆角
    }
    shape.closePath();
    return shape;
  }

  /** 等腰三角形（顶点朝上）的三个顶点 */
  function trianglePoints(width, height) {
    return [
      new THREE.Vector2(0, height / 2),
      new THREE.Vector2(-width / 2, -height / 2),
      new THREE.Vector2(width / 2, -height / 2),
    ];
  }

  /** 三角形内缩 d：绕内心等比缩放 —— 三条边都缩进同样距离，边框宽度才均匀
   *  （直接按包围盒缩放会让顶角那一侧的边框明显变宽） */
  function insetTriangle(points, d) {
    const [A, B, C] = points;
    const a = B.distanceTo(C), b = C.distanceTo(A), c = A.distanceTo(B);
    const perimeter = a + b + c;
    const incenter = new THREE.Vector2(
      (a * A.x + b * B.x + c * C.x) / perimeter,
      (a * A.y + b * B.y + c * C.y) / perimeter
    );
    const area = Math.abs((B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y)) / 2;
    const inradius = area / (perimeter / 2);
    const k = Math.max((inradius - d) / inradius, 0.05);
    return points.map(p => incenter.clone().add(p.clone().sub(incenter).multiplyScalar(k)));
  }

  /** 在两点之间架一根圆柱（支撑杆 / 斜撑用） */
  function cylinderBetween(p1, p2, radius, material) {
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, len, 16, 1), material
    );
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return mesh;
  }

  /** 路杆在某个高度的半径（顶部略细） */
  function poleRadiusAt(y) {
    const t = THREE.MathUtils.clamp(y / CONFIG.POLE_HEIGHT, 0, 1);
    return CONFIG.POLE_RADIUS * THREE.MathUtils.lerp(1, CONFIG.POLE_TAPER, t);
  }
  /* ---- 材质工厂 ----
   * 挂在路牌上的材质都是"每块路牌单独一份"，
   * 这样聚焦时才能单独淡出其它路牌而不影响主角。 */
  const makeMaterial = (color, roughness, metalness, envIntensity) =>
    new THREE.MeshStandardMaterial({
      color, roughness, metalness,
      envMapIntensity: envIntensity,
    });

  const makePoleMaterial  = () => makeMaterial(CONFIG.COLOR_POLE,  0.34, 0.80, 1.0);
  const makeRingMaterial  = () => makeMaterial(CONFIG.COLOR_RING,  0.26, 0.95, 1.05);
  const makeArmMaterial   = () => makeMaterial(CONFIG.COLOR_ARM,   0.32, 0.86, 0.95);
  const makePlateMaterial = () => makeMaterial(CONFIG.COLOR_PLATE, 0.30, 0.88, 1.05);
  const makeFrameMaterial = () => makeMaterial(CONFIG.COLOR_FRAME, 0.22, 0.92, 1.10);

  /** 路牌正面材质：加一点 emissiveMap，保证背光时图片也不会糊成一团黑 */
  function makeFaceMaterial(tex) {
    return new THREE.MeshStandardMaterial({
      map: tex,
      emissive: 0xffffff,
      emissiveMap: tex,
      // 自发光只当"防止牌面发黑"的保险，给太多会把图片洗白
      emissiveIntensity: 0.10,
      roughness: 0.66,
      metalness: 0.0,
      envMapIntensity: 0.30,
    });
  }

  // 路杆与装饰箍环用共享材质（它们不参与淡出）
  const poleMaterial = makePoleMaterial();
  const ringMaterial = makeRingMaterial();

  /** 一圈金属箍环（带两颗紧固螺栓）
   *  y     : 环所在的局部高度
   *  refY  : 用来取路杆半径的"绝对高度"（挂在 mount 里时局部 y 不等于绝对高度） */
  function createRing(y, height = CONFIG.RING_HEIGHT, grow = CONFIG.RING_GROW,
                      material = ringMaterial, refY = y) {
    const g = new THREE.Group();
    const r = poleRadiusAt(refY) * grow;
    const band = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r, height, 40, 1), material
    );
    g.add(band);
    // 螺栓：环两侧各一颗，强化"箍紧"的结构感
    const boltR = CONFIG.BOLT_RADIUS;
    for (const sign of [1, -1]) {
      const bolt = new THREE.Mesh(
        new THREE.CylinderGeometry(boltR, boltR, boltR * 3.6, 10), material
      );
      bolt.rotation.z = Math.PI / 2;
      bolt.position.set(sign * (r + boltR * 1.3), 0, 0);
      g.add(bolt);
    }
    g.position.y = y;
    return g;
  }
  /** 中央路杆：圆柱杆体（上细下粗）+ 顶部收口 + 底部法兰 */
  function createPole() {
    const g = new THREE.Group();
    const H = CONFIG.POLE_HEIGHT;
    const rBottom = CONFIG.POLE_RADIUS;
    const rTop = rBottom * CONFIG.POLE_TAPER;

    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(rTop, rBottom, H, 56, 1), poleMaterial
    );
    shaft.position.y = H / 2;
    g.add(shaft);

    // 顶部半球收口
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(rTop, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
      poleMaterial
    );
    cap.position.y = H;
    g.add(cap);

    // 杆子自身的底盘法兰（属于路杆结构，不是地面）
    const flange = new THREE.Mesh(
      new THREE.CylinderGeometry(rBottom * 1.85, rBottom * 2.15, 0.32, 48), ringMaterial
    );
    flange.position.y = 0.16;
    g.add(flange);

    return g;
  }

  /* ------------------------------------------------------------
   * 单块路牌
   * 返回的 Group：局部原点 = 路牌中心，+Z = 路牌正面法线
   *
   * 刻意拆成三个独立部件，绕开 ExtrudeGeometry 默认 UV 的坑：
   *   ① 背板 / 侧边  —— 独立几何体，纯金属材质，不贴图
   *   ② 金属边框     —— 独立几何体建模
   *   ③ 正面画面     —— PlaneGeometry / CircleGeometry / ShapeGeometry
   *                     单独重算 UV，再做 cover 裁切
   * ---------------------------------------------------------- */
  function createSign(spec, texture, index) {
    const group = new THREE.Group();
    const T = CONFIG.SIGN_THICK;
    const B = CONFIG.SIGN_BORDER;

    const plateMat = makePlateMaterial();
    const frameMat = makeFrameMaterial();
    const faceTex  = texture.clone();
    faceTex.needsUpdate = true;
    const faceMat  = makeFaceMaterial(faceTex);

    let faceGeometry, outerW, outerH;
    // 正面画面在 Z 轴上的位置：默认贴在背板正面之上一点点。
    // 三角形背板带倒角，几何体会比 T/2 再往前凸 bevelThickness，必须额外让开，
    // 否则画面会被背板的倒角顶面挡住（表现为路牌正面一片灰白、看不到图）。
    let faceZ = T / 2 + 0.008;
    if (spec.shape === 'circle') {
      /* ---------- 圆形路牌 ---------- */
      const r = spec.r;
      outerW = outerH = r * 2;

      // ① 背板：圆盘（有厚度）
      const back = new THREE.Mesh(
        new THREE.CylinderGeometry(r, r, T, 72, 1), plateMat
      );
      back.rotation.x = Math.PI / 2;   // 让圆盘正对 +Z
      group.add(back);

      // ② 圆形金属外圈
      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(r - B * 0.70, B * 0.72, 18, 90), frameMat
      );
      rim.position.z = T / 2 - B * 0.28;
      group.add(rim);

      // ③ 正面
      faceGeometry = new THREE.CircleGeometry(r - B * 1.45, 72);

    } else if (spec.shape === 'tri') {
      /* ---------- 三角形路牌（边角圆润） ---------- */
      const w = spec.s;
      const h = spec.s * 0.90;
      outerW = w; outerH = h;
      const bevel = 0.022;

      const outerPoints = trianglePoints(w, h);
      const innerPoints = insetTriangle(outerPoints, B * 1.30);
      const outerShape  = roundedPolygonShape(outerPoints, 0.30);
      const innerShape  = roundedPolygonShape(innerPoints, 0.20);

      // ① 背板：ExtrudeGeometry 只用来做"不贴图"的金属体，带小倒角 → 边角圆润
      const backGeo = new THREE.ExtrudeGeometry(outerShape, {
        depth: T, bevelEnabled: true,
        bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2,
        curveSegments: 14,
      });
      backGeo.translate(0, 0, -T / 2);
      group.add(new THREE.Mesh(backGeo, plateMat));

      // ② 边框：外轮廓挖掉内轮廓，得到一圈真实的金属包边
      const ringShape = roundedPolygonShape(outerPoints, 0.30);
      ringShape.holes.push(new THREE.Path(innerShape.getPoints(26)));
      const frameGeo = new THREE.ExtrudeGeometry(ringShape, {
        depth: B * 0.60, bevelEnabled: false, curveSegments: 14,
      });
      frameGeo.translate(0, 0, T / 2 + bevel - 0.006);
      group.add(new THREE.Mesh(frameGeo, frameMat));

      // ③ 正面：ShapeGeometry，UV 必须重算；Z 要越过背板倒角
      faceGeometry = new THREE.ShapeGeometry(innerShape, 14);
      faceZ = T / 2 + bevel + 0.010;
    } else {
      /* ---------- 横向矩形 / 竖向矩形 / 正方形 ---------- */
      const w = spec.w ?? spec.s;
      const h = spec.h ?? spec.s;
      outerW = w; outerH = h;

      // ① 背板 + 四个侧面：一块薄板
      group.add(new THREE.Mesh(new THREE.BoxGeometry(w, h, T), plateMat));

      // ② 边框：四根独立的细长金属条，略微凸出正面
      const bars = [
        [w,            B,         0,               h / 2 - B / 2],
        [w,            B,         0,             -(h / 2 - B / 2)],
        [B, Math.max(h - B * 2, 0.01), -(w / 2 - B / 2),        0],
        [B, Math.max(h - B * 2, 0.01),   w / 2 - B / 2,         0],
      ];
      for (const [bw, bh, bx, by] of bars) {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(bw, bh, B * 0.60), frameMat
        );
        bar.position.set(bx, by, T / 2 - 0.006 + B * 0.30);
        group.add(bar);
      }

      // ③ 正面
      faceGeometry = new THREE.PlaneGeometry(w - B * 2, h - B * 2, 1, 1);
    }

    /* ---- 正面贴图：重算 UV + cover 裁切 ---- */
    const { aspect } = remapUVByBoundingBox(faceGeometry);
    fitTextureCover(faceTex, aspect);
    const face = new THREE.Mesh(faceGeometry, faceMat);
    face.position.z = faceZ;
    group.add(face);

    /* ---- 背面的安装支架（让支撑杆的连接看起来是真的拧上去的） ---- */
    const bracketMat = makeArmMaterial();
    const bracketPlate = new THREE.Mesh(
      new THREE.CylinderGeometry(0.23, 0.23, 0.05, 24), bracketMat
    );
    bracketPlate.rotation.x = Math.PI / 2;
    bracketPlate.position.z = -T / 2 - 0.025;
    group.add(bracketPlate);
    for (const sy of [1, -1]) {
      const rib = new THREE.Mesh(
        new THREE.BoxGeometry(0.10, Math.min(outerH * 0.42, 1.1), 0.085), bracketMat
      );
      rib.position.set(0, sy * Math.min(outerH * 0.22, 0.55), -T / 2 - 0.04);
      group.add(rib);
    }
    group.userData = {
      isSign: true,
      index,
      shape: spec.shape,
      width: outerW,
      height: outerH,
      // 右键换图要用：正面网格 / 正面材质 / 正面长宽比（cover 裁切需要）
      faceMesh: face,
      faceMaterial: faceMat,
      faceAspect: aspect,
      imageName: '',
    };
    return group;
  }

  /* ------------------------------------------------------------
   * 支撑结构 + 挂载
   * mount 的局部坐标系：原点在路杆轴心的安装高度上，+Z 指向支撑杆伸出方向
   * ---------------------------------------------------------- */
  function createMount(spec, sign) {
    const mount = new THREE.Group();
    mount.position.set(0, spec.y, 0);
    mount.rotation.y = THREE.MathUtils.degToRad(spec.angle);

    const armMat  = makeArmMaterial();
    const ringMat = makeRingMaterial();
    const T = CONFIG.SIGN_THICK;

    // 抱箍：支撑杆真正"抓"在路杆上的地方
    mount.add(createRing(0, CONFIG.CLAMP_HEIGHT, CONFIG.CLAMP_GROW, ringMat, spec.y));

    // 主横杆：从路杆表面一直顶到路牌背面
    const armStart = poleRadiusAt(spec.y) * 1.05;
    const armEnd   = spec.arm;
    const armLen   = Math.max(armEnd - armStart, 0.2);
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.082, armLen, 20, 1), armMat
    );
    arm.rotation.x = Math.PI / 2;
    arm.position.z = armStart + armLen / 2;
    mount.add(arm);

    // 斜撑：从下方另一个抱箍斜拉到横杆末端，形成受力三角
    const braceDrop = Math.min(1.15, spec.y * 0.28);
    if (braceDrop > 0.35) {
      mount.add(createRing(-braceDrop, CONFIG.RING_HEIGHT, CONFIG.CLAMP_GROW - 0.03,
                           ringMat, spec.y - braceDrop));
      mount.add(cylinderBetween(
        new THREE.Vector3(0, -braceDrop, poleRadiusAt(spec.y) * 1.30),
        new THREE.Vector3(0, -0.03, armEnd * 0.88),
        0.045, armMat
      ));
    }

    // 路牌本体：yaw 让正面与横杆方向错开，tilt 给一点手工歪斜
    sign.position.z = armEnd + T / 2;
    sign.rotation.y = THREE.MathUtils.degToRad(spec.yaw);
    sign.rotation.z = THREE.MathUtils.degToRad(spec.tilt);
    mount.add(sign);

    return mount;
  }
  /* ------------------------------------------------------------
   * 组装整个装置
   * ---------------------------------------------------------- */
  const installation = new THREE.Group();   // 路杆 + 全部路牌，聚焦时整组位移
  scene.add(installation);

  const signEntries = [];   // { sign, mount, materials, dim, dimTarget, hover, hoverTarget }
  const pickables   = [];   // 参与射线检测的网格（只有路牌本体，横杆和路杆不算）

  function buildInstallation(entries) {
    installation.add(createPole());

    // 装饰性箍环
    for (const y of EXTRA_RING_HEIGHTS) {
      installation.add(createRing(y));
    }

    // 图片随机分配给路牌：先洗牌，数量不够就循环使用
    const rand = createRandom(CONFIG.SHUFFLE_SEED);
    const pool = entries.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    SIGN_LAYOUT.forEach((spec, i) => {
      const entry = pool[i % pool.length];
      const sign  = createSign(spec, entry.texture, i);
      const mount = createMount(spec, sign);
      installation.add(mount);
      sign.userData.imageName = entry.name;

      // 收集这一组的全部材质，聚焦时整组一起淡出
      const materials = [];
      mount.traverse(obj => {
        if (!obj.isMesh) return;
        if (materials.indexOf(obj.material) === -1) materials.push(obj.material);
      });
      // 只有路牌本体可以被点中
      sign.traverse(obj => {
        if (!obj.isMesh) return;
        obj.userData.owner = sign;
        pickables.push(obj);
      });

      signEntries.push({
        sign, mount, materials,
        dim: 0, dimTarget: 0,
        hover: 0, hoverTarget: 0,
      });
      sign.userData.entry = signEntries[signEntries.length - 1];
    });
  }
  /** 根据模型真实包围盒自动取景：任意窗口比例下都不会切边、也不会显得太小 */
  function fitCameraToInstallation() {
    const box = new THREE.Box3().setFromObject(installation);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    HOME_TARGET.set(0, center.y, 0);
    FOCUS_ANCHOR.set(0, center.y, 0);

    const halfV = Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2));
    const halfH = halfV * camera.aspect;
    const radiusXZ = Math.max(size.x, size.z) * 0.5;   // 装置的"横向半径"
    const distance =
      Math.max(
        (size.y * 0.5 * CONFIG.FRAME_MARGIN) / halfV,
        (radiusXZ * CONFIG.FRAME_MARGIN) / halfH
      ) + radiusXZ;                                    // 补上离相机最近那一侧的进深

    controls.minDistance = distance * CONFIG.ZOOM_MIN_FACTOR;
    controls.maxDistance = distance * CONFIG.ZOOM_MAX_FACTOR;

    camera.position.setFromSpherical(new THREE.Spherical(
      distance,
      THREE.MathUtils.degToRad(CONFIG.POLAR_CENTER),
      THREE.MathUtils.degToRad(CONFIG.HOME_AZIMUTH)
    )).add(HOME_TARGET);
    controls.target.copy(HOME_TARGET);
    controls.update();
  }

  /* ============================================================
   * 5. 交互状态 & 缓动动画
   * ========================================================== */
  let focusedSign = null;      // 当前聚焦的路牌（null = 浏览模式）
  let hoveredSign = null;
  let idleTime = 0;            // 停手时长，用于空闲自转

  // 进入聚焦前的视角快照 —— 退出时要"原样"恢复，而不是回到初始视角
  const savedView = {
    valid: false,
    eye: new THREE.Vector3(),
    target: new THREE.Vector3(),
    group: new THREE.Vector3(),
  };

  // 相机在球坐标下插值 → 走的是弧线，比直线 lerp 更有产品展示的高级感
  const transition = {
    active: false,
    t: 0,
    duration: 1,
    onComplete: null,
    from: { sph: new THREE.Spherical(), target: new THREE.Vector3(), group: new THREE.Vector3() },
    to:   { sph: new THREE.Spherical(), target: new THREE.Vector3(), group: new THREE.Vector3() },
  };

  const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function startTransition(toTarget, toEye, toGroupPos, duration, onComplete = null) {
    closePicker();                 // 相机一动，屏幕坐标定位的面板就该关掉
    transition.from.target.copy(controls.target);
    transition.from.group.copy(installation.position);
    transition.from.sph.setFromVector3(
      new THREE.Vector3().subVectors(camera.position, controls.target)
    );

    transition.to.target.copy(toTarget);
    transition.to.group.copy(toGroupPos);
    transition.to.sph.setFromVector3(
      new THREE.Vector3().subVectors(toEye, toTarget)
    );

    // 水平方向走最短路径，避免绕远路
    let dTheta = transition.to.sph.theta - transition.from.sph.theta;
    while (dTheta >  Math.PI) dTheta -= Math.PI * 2;
    while (dTheta < -Math.PI) dTheta += Math.PI * 2;
    transition.to.sph.theta = transition.from.sph.theta + dTheta;

    transition.t = 0;
    transition.duration = duration;
    transition.onComplete = onComplete;
    transition.active = true;
    controls.enabled = false;
    controls.autoRotate = false;
  }
  const _tmpSph = new THREE.Spherical();

  function updateTransition(dt) {
    if (!transition.active) return;

    transition.t = Math.min(1, transition.t + dt / transition.duration);
    const e = easeInOutCubic(transition.t);
    const { from, to } = transition;

    // 相机与模型完全同步：同一个 e，绝不会出现"模型先动相机后动"
    controls.target.lerpVectors(from.target, to.target, e);
    installation.position.lerpVectors(from.group, to.group, e);

    _tmpSph.set(
      THREE.MathUtils.lerp(from.sph.radius, to.sph.radius, e),
      THREE.MathUtils.lerp(from.sph.phi,    to.sph.phi,    e),
      THREE.MathUtils.lerp(from.sph.theta,  to.sph.theta,  e)
    );
    camera.position.setFromSpherical(_tmpSph).add(controls.target);
    camera.lookAt(controls.target);

    if (transition.t >= 1) {
      transition.active = false;
      const cb = transition.onComplete;
      transition.onComplete = null;
      if (cb) cb();
    }
  }

  /** 聚焦所需的相机距离：横竖两个方向都要装得下，所以窄窗口也不会切边 */
  function computeFocusDistance(width, height) {
    const halfV = Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2));
    const halfH = halfV * camera.aspect;
    const margin = CONFIG.FOCUS_MARGIN;        // 四周留白（越小路牌越大）
    return Math.max(
      (height * 0.5 * margin) / halfV,
      (width  * 0.5 * margin) / halfH
    ) + 0.55;
  }

  function updateDimTargets() {
    for (const entry of signEntries) {
      entry.dimTarget = (focusedSign && entry.sign !== focusedSign) ? 1 : 0;
    }
  }

  function setHint(text) {
    hintEl.textContent = text;
  }
  const HINT_BROWSE = '拖动 · 水平环绕观察　　点击路牌 · 聚焦查看　　右键路牌 · 更换图片';
  const HINT_FOCUS  = '点击空白处 · 退出聚焦　　右键路牌 · 更换图片';
  /** 进入聚焦：整组位移让路牌落到画面中心，相机转到该路牌正面 */
  function focusOnSign(sign) {
    // 第一次进入聚焦时保存当前视角（连续切换路牌不会覆盖它）
    if (!focusedSign) {
      savedView.eye.copy(camera.position);
      savedView.target.copy(controls.target);
      savedView.group.copy(installation.position);
      savedView.valid = true;
    }
    focusedSign = sign;

    sign.updateWorldMatrix(true, false);
    const worldPos = new THREE.Vector3().setFromMatrixPosition(sign.matrixWorld);

    // 路牌正面法线（Group 的 +Z）。压平 y 保证相机始终水平，不产生俯仰。
    const normal = sign.getWorldDirection(new THREE.Vector3());
    normal.y = 0;
    if (normal.lengthSq() < 1e-6) normal.set(0, 0, 1);
    normal.normalize();

    // installation 只有位移，没有旋转缩放，所以"局部位置 = 世界位置 - 组位移"
    const localPos = worldPos.clone().sub(installation.position);
    // 让这块路牌的世界坐标正好落在锚点上 → 视觉上整组向左（并上下）平移
    const groupTo = FOCUS_ANCHOR.clone().sub(localPos);

    const { width, height } = sign.userData;
    const distance = computeFocusDistance(width * 1.05, height * 1.05);
    // 相机站在路牌正前方 → 正面与屏幕平行；点到背面也会自动绕到正面
    const eye = FOCUS_ANCHOR.clone().addScaledVector(normal, distance);

    startTransition(FOCUS_ANCHOR, eye, groupTo, CONFIG.FOCUS_DURATION);
    updateDimTargets();
    setHint(HINT_FOCUS);
  }

  /** 退出聚焦：恢复到进入前的视角（不是初始视角） */
  function exitFocus() {
    if (!focusedSign) return;
    focusedSign = null;
    updateDimTargets();

    const target = savedView.valid ? savedView.target : HOME_TARGET;
    const eye    = savedView.valid ? savedView.eye    : camera.position;
    const group  = savedView.valid ? savedView.group  : new THREE.Vector3();

    startTransition(target, eye, group, CONFIG.RESET_DURATION, () => {
      controls.enabled = true;
      controls.update();
    });
    setHint(HINT_BROWSE);
  }
  /* ------------------------------------------------------------
   * 右键换图 —— 语义是"彻底替换"，不是往上叠一层：
   * imagePool 只保存装置上当前真实存在的图片。被换下来的图会连同
   * 显存和 blob URL 一起释放，面板里不再出现，也不可能被再选中。
   *   · 点缩略图        → 把这张图换到目标路牌
   *   · 替换全部路牌    → 清空旧图，用新选的图重铺全部路牌
   *   · 只换这一块      → 只换目标路牌，换下来的旧图若已无人使用就丢弃
   * ---------------------------------------------------------- */
  const imagePool = [];             // { name, texture, objectURL? }
  const pickerEl  = document.getElementById('img-picker');
  let   pickerSign = null;          // 当前正在换图的路牌（null = 面板关闭）

  // 缩略图地址：图片贴图直接用 <img>.src，canvas 占位图导出成 dataURL
  function textureThumbSrc(tex) {
    const img = tex.image;
    if (!img) return '';
    if (img.src) return img.src;
    if (typeof img.toDataURL === 'function') return img.toDataURL();
    return '';
  }

  /** 换图：克隆一份贴图单独做 cover 裁切，所以同一张图用在多块路牌上互不干扰 */
  function applyImageToSign(sign, entry) {
    const { faceMaterial, faceAspect } = sign.userData;
    if (!faceMaterial) return;

    const tex = setupTexture(entry.texture.clone());
    tex.needsUpdate = true;
    fitTextureCover(tex, faceAspect);

    const previous = faceMaterial.map;
    faceMaterial.map = tex;
    // emissiveMap 必须跟着一起换。只换 map 的话，自发光通道还挂着旧贴图，
    // 旧图会以发光的形式叠在新图下面 —— 看上去就是"换完还有一层底图"。
    faceMaterial.emissiveMap = tex;
    faceMaterial.needsUpdate = true;
    // 释放上一张克隆贴图占用的显存（原图 source 是共享的，不会被误删）
    if (previous && previous !== entry.texture) previous.dispose();

    sign.userData.imageName = entry.name;
  }

  /** 彻底丢掉一张图：显存和 blob URL 一起释放，之后再也拿不回来 */
  function disposeEntry(entry) {
    entry.texture.dispose();
    if (entry.objectURL) URL.revokeObjectURL(entry.objectURL);
  }

  /** 名字去重：面板靠名字判断"这块路牌用的是哪张"，重名会串图 */
  function uniqueName(name) {
    if (!imagePool.some(e => e.name === name)) return name;
    const dot  = name.lastIndexOf('.');
    const base = dot > 0 ? name.slice(0, dot) : name;
    const ext  = dot > 0 ? name.slice(dot)    : '';
    let n = 2;
    while (imagePool.some(e => e.name === base + ' (' + n + ')' + ext)) n++;
    return base + ' (' + n + ')' + ext;
  }

  /** 池子里只留还挂在路牌上的图，换下来的旧图立刻清掉 */
  function pruneImagePool() {
    const inUse = new Set(signEntries.map(e => e.sign.userData.imageName));
    for (let i = imagePool.length - 1; i >= 0; i--) {
      if (!inUse.has(imagePool[i].name)) disposeEntry(imagePool.splice(i, 1)[0]);
    }
  }

  /** 整池替换：新图按顺序铺满全部路牌，旧图一张不留 */
  function replaceImagePool(entries) {
    if (!entries.length) return;
    const discarded = imagePool.splice(0, imagePool.length);
    for (const entry of entries) {
      entry.name = uniqueName(entry.name);
      imagePool.push(entry);
    }
    // 先让每块路牌换上新图（内部会释放旧的克隆贴图），再释放旧原图，
    // 顺序反了会在这一帧释放正在渲染的贴图。
    signEntries.forEach((e, i) => applyImageToSign(e.sign, imagePool[i % imagePool.length]));
    discarded.forEach(disposeEntry);
    saveImageState();
  }

  // 隐藏的文件选择框：上传的图片走 blob URL，不受 file:// 跨域限制
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.style.display = 'none';
  document.body.appendChild(fileInput);

  let uploadMode = 'all';            // 'all' = 替换全部路牌；'one' = 只换右键那一块

  /** 选中的文件逐个转成贴图，读不出来的直接跳过 */
  function loadFileEntries(files) {
    return Promise.all(files.map(file => new Promise(resolve => {
      const url = URL.createObjectURL(file);
      textureLoader.load(
        url,
        tex => resolve({ name: file.name, texture: setupTexture(tex), objectURL: url, blob: file }),
        undefined,
        () => { URL.revokeObjectURL(url); resolve(null); }
      );
    }))).then(list => list.filter(Boolean));
  }

  function openUpload(mode) {
    uploadMode = mode;
    fileInput.multiple = (mode === 'all');   // 替换全部时可以一次多选
    fileInput.click();
  }

  fileInput.addEventListener('change', async () => {
    const files  = Array.from(fileInput.files || []);
    const target = pickerSign;               // 关面板前先记住目标路牌
    const mode   = uploadMode;
    fileInput.value = '';
    closePicker();
    if (!files.length) return;

    const entries = await loadFileEntries(files);
    if (!entries.length) return;

    if (mode === 'all' || !target) {
      replaceImagePool(entries);             // 旧图从路牌和池子里同时消失
    } else {
      entries[0].name = uniqueName(entries[0].name);
      imagePool.push(entries[0]);
      applyImageToSign(target, entries[0]);
      entries.slice(1).forEach(disposeEntry);  // 单块模式只用第一张
      pruneImagePool();                       // 换下来的旧图若已无人使用就丢掉
      saveImageState();
    }
  });

  function renderPicker() {
    pickerEl.innerHTML = '';

    const title = document.createElement('h2');
    title.innerHTML = '更换图片 · <em>' +
      (pickerSign ? '第 ' + (pickerSign.userData.index + 1) + ' 块路牌' : '') + '</em>';
    pickerEl.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const entry of imagePool) {
      const thumb = document.createElement('div');
      thumb.className = 'thumb' +
        (pickerSign && pickerSign.userData.imageName === entry.name ? ' active' : '');
      thumb.title = entry.name;
      const im = document.createElement('img');
      im.src = textureThumbSrc(entry.texture);
      im.alt = entry.name;
      thumb.appendChild(im);
      thumb.addEventListener('click', () => {
        if (pickerSign) { applyImageToSign(pickerSign, entry); saveImageState(); }
        closePicker();
      });
      grid.appendChild(thumb);
    }
    pickerEl.appendChild(grid);

    const swapAll = document.createElement('button');
    swapAll.className = 'upload';
    swapAll.textContent = '＋ 选图片 · 彻底替换全部';
    swapAll.title = '清空现有图片，用新选的图重铺所有路牌';
    swapAll.addEventListener('click', () => openUpload('all'));
    pickerEl.appendChild(swapAll);

    const swapOne = document.createElement('button');
    swapOne.className = 'upload ghost';
    swapOne.textContent = '只换这一块…';
    swapOne.title = '只换目标路牌，换下来的旧图会被丢弃';
    swapOne.addEventListener('click', () => openUpload('one'));
    pickerEl.appendChild(swapOne);

    const reset = document.createElement('button');
    reset.className = 'upload ghost';
    reset.textContent = '恢复原始图片';
    reset.title = '清掉已保存的图片，回到 tupian/ 文件夹里那套（会刷新页面）';
    reset.addEventListener('click', () => resetImageState());
    pickerEl.appendChild(reset);

    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = '换过的图会自动保存，下次打开还是这些图';
    pickerEl.appendChild(note);
  }

  function openPicker(sign, x, y) {
    pickerSign = sign;
    renderPicker();
    pickerEl.classList.add('show');
    // 先显示再量尺寸，然后夹进视口，避免贴边时被截断
    const box = pickerEl.getBoundingClientRect();
    pickerEl.style.left =
      Math.max(12, Math.min(x + 6, window.innerWidth  - box.width  - 12)) + 'px';
    pickerEl.style.top =
      Math.max(12, Math.min(y + 6, window.innerHeight - box.height - 12)) + 'px';
  }

  function closePicker() {
    if (!pickerSign) return;
    pickerEl.classList.remove('show');
    pickerSign = null;
  }

  /* ------------------------------------------------------------
   * 图片状态持久化（IndexedDB）
   * 换过图之后自动保存，下次打开还是上次那套图。
   *   · 上传的图片存完整 blob（磁盘上没有这个文件，不存就丢了）
   *   · 从 tupian/ 读来的图只存文件名，下次照原路加载，不占额外空间
   * 用 IndexedDB 而不是 localStorage：localStorage 只有 5MB 且只能存字符串，
   * 图片转 base64 会再胖 33%，几张大图就爆。
   * ---------------------------------------------------------- */
  const DB_NAME = 'signpost-images';
  const STORE_BLOB = 'blobs';
  const STORE_META = 'meta';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_BLOB)) db.createObjectStore(STORE_BLOB);
        if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  function idbReq(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  /** 把当前图片池 + 每块路牌用哪张，一起写进 IndexedDB */
  async function saveImageState() {
    if (!window.indexedDB) return;
    try {
      const db = await openDB();
      // 先清空 blob 表：被换掉的图不该继续占着配额
      await idbReq(db.transaction(STORE_BLOB, 'readwrite').objectStore(STORE_BLOB).clear());
      const store = db.transaction(STORE_BLOB, 'readwrite').objectStore(STORE_BLOB);
      for (const e of imagePool) if (e.blob) store.put(e.blob, e.name);

      const meta = {
        defaultsVersion: CONFIG.DEFAULTS_VERSION,
        pool:  imagePool.map(e => ({ name: e.name, kind: e.blob ? 'blob' : 'file' })),
        signs: signEntries.map(s => s.sign.userData.imageName),
        savedAt: Date.now(),
      };
      await idbReq(db.transaction(STORE_META, 'readwrite')
                     .objectStore(STORE_META).put(meta, 'state'));
    } catch (err) {
      console.warn('图片状态保存失败（不影响本次浏览）：', err);
    }
  }

  /** 读回上次保存的图片；没有保存过、或图都失效了就返回 null 走默认加载。
   *  外面套了超时：万一 IndexedDB 被别的标签页锁住迟迟不响应，
   *  也不能把整个页面卡在 LOADING —— 超时就当没保存过。 */
  function loadImageState() {
    return Promise.race([
      readImageState(),
      new Promise(resolve => setTimeout(() => resolve(null), 3000)),
    ]);
  }

  async function readImageState() {
    if (!window.indexedDB) return null;
    try {
      const db = await openDB();
      const meta = await idbReq(db.transaction(STORE_META).objectStore(STORE_META).get('state'));
      if (!meta || !meta.pool || !meta.pool.length) return null;

      // 默认图换过一批了（DEFAULTS_VERSION 变了）：旧记录作废，直接用新的默认图
      if (meta.defaultsVersion !== CONFIG.DEFAULTS_VERSION) {
        await idbReq(db.transaction(STORE_BLOB, 'readwrite').objectStore(STORE_BLOB).clear());
        await idbReq(db.transaction(STORE_META, 'readwrite').objectStore(STORE_META).clear());
        return null;
      }

      const entries = [];
      for (const item of meta.pool) {
        if (item.kind === 'blob') {
          const blob = await idbReq(
            db.transaction(STORE_BLOB).objectStore(STORE_BLOB).get(item.name)
          );
          if (!blob) continue;                       // blob 丢了就跳过这张
          const url = URL.createObjectURL(blob);
          const tex = await new Promise(res => textureLoader.load(
            url, t => res(setupTexture(t)), undefined, () => res(null)
          ));
          if (tex) entries.push({ name: item.name, texture: tex, objectURL: url, blob });
          else URL.revokeObjectURL(url);
        } else {
          // 磁盘上的图：还按 IMAGE_DIRS 找，文件被删了就跳过
          const tex = await loadTextureWithFallback(item.name);
          if (tex) entries.push({ name: item.name, texture: tex });
        }
      }
      return entries.length ? { entries, signs: meta.signs || [] } : null;
    } catch (err) {
      console.warn('读取已保存图片失败，回到默认图片：', err);
      return null;
    }
  }

  /** 按保存的记录把每块路牌还原成上次那张 */
  function applySavedAssignment(names) {
    signEntries.forEach((e, i) => {
      const name  = names[i];
      const entry = name ? imagePool.find(x => x.name === name) : null;
      if (entry && e.sign.userData.imageName !== name) applyImageToSign(e.sign, entry);
    });
  }

  /** 清掉保存的图片，回到 tupian/ 文件夹里的原始那套 */
  async function resetImageState() {
    try {
      const db = await openDB();
      await idbReq(db.transaction(STORE_BLOB, 'readwrite').objectStore(STORE_BLOB).clear());
      await idbReq(db.transaction(STORE_META, 'readwrite').objectStore(STORE_META).clear());
    } catch (err) {
      console.warn('清除保存的图片失败：', err);
    }
    location.reload();
  }

  /* ---- 射线拾取 ---- */
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();

  function pickSign(clientX, clientY) {
    pointerNDC.x =  (clientX / window.innerWidth)  * 2 - 1;
    pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    return hits.length ? hits[0].object.userData.owner : null;
  }

  /* ---- 鼠标 / 触控事件 ---- */
  const canvas = renderer.domElement;
  let downX = 0, downY = 0, downTime = 0;

  canvas.addEventListener('pointerdown', e => {
    downX = e.clientX; downY = e.clientY; downTime = performance.now();
    idleTime = 0;
    controls.autoRotate = false;
  });

  canvas.addEventListener('pointerup', e => {
    idleTime = 0;
    if (e.button !== 0) return;                // 只有左键算点击（右键留给换图面板）
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    const held  = performance.now() - downTime;
    if (moved > 6 || held > 500) return;       // 判定为拖拽，不算点击
    if (transition.active) return;

    const sign = pickSign(e.clientX, e.clientY);
    if (sign) {
      if (sign !== focusedSign) focusOnSign(sign);
    } else if (focusedSign) {
      exitFocus();                              // 点空白（或点到路杆）→ 退出聚焦
    }
  });

  /* 右键路牌 → 弹出换图面板；右键空白处不拦截，保留浏览器默认行为 */
  canvas.addEventListener('contextmenu', e => {
    const sign = pickSign(e.clientX, e.clientY);
    if (!sign) { closePicker(); return; }
    e.preventDefault();
    idleTime = 0;
    openPicker(sign, e.clientX, e.clientY);
  });

  // 点面板以外的任何地方就关掉它（捕获阶段，先于画布自己的处理）
  window.addEventListener('pointerdown', e => {
    if (pickerSign && !pickerEl.contains(e.target)) closePicker();
  }, true);

  canvas.addEventListener('pointermove', e => {
    idleTime = 0;
    hoveredSign = transition.active ? null : pickSign(e.clientX, e.clientY);
    canvas.style.cursor = hoveredSign
      ? 'pointer'
      : (focusedSign ? 'zoom-out' : 'grab');
    for (const entry of signEntries) {
      entry.hoverTarget = (entry.sign === hoveredSign && entry.sign !== focusedSign) ? 1 : 0;
    }
  });

  canvas.addEventListener('wheel', () => { idleTime = 0; closePicker(); }, { passive: true });
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (pickerSign) closePicker();             // Esc 先关面板，再按一次才退出聚焦
    else exitFocus();
  });
  window.addEventListener('resize', () => {
    closePicker();                              // 面板是屏幕坐标定位的，改窗口就关掉
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ============================================================
   * 6. 每帧更新
   * ========================================================== */

  /** 聚焦时其余路牌淡出、悬停路牌轻微放大 —— 都用指数缓动，不会有硬切 */
  function updateSignVisuals(dt) {
    const k = 1 - Math.exp(-dt * 7);

    for (const entry of signEntries) {
      if (Math.abs(entry.dim - entry.dimTarget) > 1e-4) {
        entry.dim += (entry.dimTarget - entry.dim) * k;
        const opacity = THREE.MathUtils.lerp(1, CONFIG.DIM_OPACITY, entry.dim);
        const transparent = opacity < 0.995;
        for (const m of entry.materials) {
          if (m.transparent !== transparent) {
            m.transparent = transparent;
            m.depthWrite = !transparent;
            m.needsUpdate = true;          // transparent 变化需要重建 program
          }
          m.opacity = opacity;
        }
      }
      if (Math.abs(entry.hover - entry.hoverTarget) > 1e-4) {
        entry.hover += (entry.hoverTarget - entry.hover) * k;
        entry.sign.scale.setScalar(1 + entry.hover * CONFIG.HOVER_SCALE);
      }
    }
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (transition.active) {
      updateTransition(dt);           // 过渡期间由动画独占相机
    } else if (!focusedSign) {
      // 只有浏览模式才交给 OrbitControls。
      // 聚焦时必须跳过 update()，否则它会把相机距离夹回 minDistance，
      // 造成动画刚结束就"弹开"一下。
      idleTime += dt;
      controls.autoRotate = CONFIG.AUTO_ROTATE && controls.enabled
        && idleTime > CONFIG.AUTO_ROTATE_IDLE;
      controls.update();              // 阻尼 + 空闲自转
    }

    updateSignVisuals(dt);
    renderer.render(scene, camera);
  }
  /* ============================================================
   * 7. 启动
   * ========================================================== */

  /** file:// 直接打开时，Chrome 会以跨域为由拦截本地图片，这里给出解决办法 */
  /* 一张图都没读到时的提示。
   * 能执行到这里说明页面是走 HTTP 打开的（file:// 会被前面那段普通脚本拦下），
   * 所以原因基本只有一个：文件名和 CONFIG.IMAGE_FILES 对不上。 */
  function showFileTip() {
    fileTipEl.innerHTML =
      '<b>没有读到图片，当前显示的是占位图。</b>' +
      '检查 <code>tupian/</code> 目录里的文件名，是否和源码 <code>CONFIG.IMAGE_FILES</code> 里写的完全一致。<br>' +
      '也可以直接<b>右键任意路牌 → 从本地选图片</b>，手动挑一张换上去。';
    fileTipEl.classList.add('show');
  }

  async function init() {
    // 先看有没有上次保存的图片；有就用它，没有才读 tupian/ 目录
    const saved = await loadImageState();
    const { entries, usedPlaceholder } = saved
      ? { entries: saved.entries, usedPlaceholder: false }
      : await loadAllTextures();
    imagePool.push(...entries);          // 右键换图面板的可选图片池

    buildInstallation(entries);
    if (saved) applySavedAssignment(saved.signs);   // 还原"哪块路牌用哪张"
    fitCameraToInstallation();
    setHint(HINT_BROWSE);
    canvas.style.cursor = 'grab';

    if (usedPlaceholder) showFileTip();

    // 淡出加载遮罩
    loaderEl.classList.add('hidden');
    setTimeout(() => loaderEl.remove(), 700);

    animate();
  }

  init();
  </script>
</body>
</html>
